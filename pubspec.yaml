name: protegey_sdk
description: >
  Official Protegey SDK for Flutter — device intelligence and transaction reporting,
  called directly from your app with your own API key.
version: 0.1.0
homepage: https://github.com/protegey/protegey-sdk-flutter
publish_to: none # flip once ready to publish to pub.dev

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: '>=1.0.0 <2.0.0'
  device_info_plus: '>=9.0.0 <12.0.0'
  crypto: '>=3.0.0 <4.0.0'
  uuid: '>=4.0.0 <5.0.0'
  # Tier 1/2 device-intelligence enrichment (2026-09-23) — all three are zero-extra-permission on
  # both platforms (no dangerous Android permission, no ATT prompt on iOS), chosen specifically to
  # avoid anything that could draw store-review scrutiny. See device.dart/fingerprint.dart.
  connectivity_plus: '>=6.0.0 <7.0.0'
  battery_plus: '>=6.0.0 <7.0.0'
  flutter_jailbreak_detection: '>=1.10.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <5.0.0'
