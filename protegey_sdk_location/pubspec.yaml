name: protegey_sdk_location
description: >
  Optional GPS add-on for the Protegey Flutter SDK — reads the device position for
  device.identify() and transactions.report(). Only apps that install it declare a location
  permission.
version: 0.1.0
homepage: https://github.com/protegey/protegey_flutter_sdk
publish_to: none # flip once ready to publish to pub.dev

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  protegey_sdk:
    path: ../
  geolocator: '>=13.0.0 <15.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <5.0.0'
  geolocator_platform_interface: any
  plugin_platform_interface: any
